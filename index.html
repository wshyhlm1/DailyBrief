<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {

    display: grid;
    place-items: center;
    padding: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,

    background:

      linear-gradient(135deg, #f8fafc, #eef2ff);
    color: #111827;
  }
  .card {
    width: min(100%, 28rem);
    padding: 1.7rem;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    backdrop-filter: blur(14px);
  }

    margin: 0 0 0.35rem;
    color: #64748b;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: 1.65rem;
    line-height: 1.15;
    letter-spacing: -0.03em;
  }
  .hint {
    margin: 0.8rem 0 1.2rem;
    color: #475569;
    font-size: 0.94rem;
    line-height: 1.65;
  }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 650; }
  input[type="password"] {
    width: 100%;
    padding: 0.82rem 0.9rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.7rem;
    background: #fff;
    color: #111827;
    font: inherit;
  }
  input[type="password"]:focus {
    outline: 2px solid rgba(37, 99, 235, 0.26);
    border-color: #2563eb;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.85rem 0 1rem;
    color: #475569;
    font-size: 0.88rem;
    font-weight: 500;
  }
  .remember input { width: 1rem; height: 1rem; }
  button {
    width: 100%;
    border: 0;
    border-radius: 0.7rem;
    padding: 0.82rem 1rem;
    background: #111827;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }
  button:disabled { cursor: wait; opacity: 0.7; }
  .status {
    min-height: 1.4rem;
    margin-top: 0.85rem;
    color: #64748b;
    font-size: 0.86rem;
  }
  .status.error { color: #b91c1c; }
  .fine-print {
    margin: 1rem 0 0;
    color: #94a3b8;
    font-size: 0.76rem;
    line-height: 1.55;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 32rem),
        linear-gradient(135deg, #020617, #111827);
      color: #f8fafc;
    }
    .card {
      border-color: rgba(148, 163, 184, 0.22);
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }
    .eyebrow,
    .hint,
    .remember,
    .status { color: #cbd5e1; }
    input[type="password"] {
      border-color: #334155;
      background: #020617;
      color: #f8fafc;
    }
    button { background: #f8fafc; color: #020617; }
    .fine-print { color: #94a3b8; }
    .status.error { color: #fca5a5; }
  }

  var storageKey = "daily-brief:password:v1";
  var form = document.getElementById("unlock-form");
  var input = document.getElementById("password");
  var remember = document.getElementById("remember");
  var button = document.getElementById("unlock-button");
  var status = document.getElementById("status");
  var decoder = new TextDecoder();
  var encoder = new TextEncoder();

  function setStatus(message, isError) {
    status.textContent = message || "";
    status.classList.toggle("error", Boolean(isError));
  }

  function b64ToBytes(value) {
    var binary = atob(value);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  function readRememberedPassword() {
    try {
      var raw = localStorage.getItem(storageKey);
      if (!raw) return "";
      var saved = JSON.parse(raw);
      if (!saved || !saved.password || !saved.expiresAt || saved.expiresAt <= Date.now()) {
        localStorage.removeItem(storageKey);
        return "";
      }
      return saved.password;
    } catch (_) {
      return "";
    }
  }

  function rememberPassword(password) {
    if (!remember.checked) return;
    try {
      localStorage.setItem(
        storageKey,
        JSON.stringify({
          password: password,
          expiresAt: Date.now() + encrypted.rememberDays * 24 * 60 * 60 * 1000,
        }),
      );
    } catch (_) {
      // Browsers can disable localStorage; unlocking should still work.
    }
  }

  async function deriveKey(password) {
    var baseKey = await crypto.subtle.importKey(
      "raw",
      encoder.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"],
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(encrypted.salt),
        iterations: encrypted.iterations,
        hash: "SHA-256",
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"],
    );
  }

  async function decrypt(password) {
    var key = await deriveKey(password);
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(encrypted.iv) },
      key,
      b64ToBytes(encrypted.payload),
    );
    return decoder.decode(plain);
  }

  async function unlock(password, automatic) {
    if (!window.crypto || !crypto.subtle) {
      setStatus("当前浏览器不支持 Web Crypto，无法解密页面。", true);
      return;
    }
    button.disabled = true;
    setStatus(automatic ? "正在使用已保存的密码打开…" : "正在解密…", false);
    try {
      var html = await decrypt(password);
      rememberPassword(password);
      window.__DAILY_BRIEF_PASSWORD = password;
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      if (automatic) {
        try { localStorage.removeItem(storageKey); } catch (_) {}
      }
      button.disabled = false;
      setStatus("密码不对，或者这份简报使用了不同的旧密码。", true);
      input.focus();
      input.select();
    }
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    unlock(input.value, false);
  });

  var savedPassword = readRememberedPassword();
  if (savedPassword) {
    unlock(savedPassword, true);
  }
})();
